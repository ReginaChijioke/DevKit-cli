[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devkit-cli"
version = "0.1.0"
description = "A command-line toolkit for developers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31"
]

[project.scripts]
devkit = "devkit.cli:main"

[tool.setuptools]
packages = ["devkit"]

